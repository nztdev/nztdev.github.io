<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nztdev · field of works</title>
<meta name="description" content="nztdev — experimental systems at the edge of computation, biology, and signal.">
<meta property="og:title" content="nztdev · field of works">
<meta property="og:description" content="Experimental systems at the edge of computation, biology, and signal.">
<meta property="og:url" content="https://nztdev.github.io">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Theme variables ───────────────────────────────────── */
:root {
  --bg:              #09080e;
  --card-bg:         rgba(12,10,22,0.97);
  --card-border:     rgba(127,119,221,0.28);
  --text-primary:    #e8e6f8;
  --text-secondary:  rgba(232,230,248,0.5);
  --text-muted:      rgba(232,230,248,0.4);
  --hdr-name:        rgba(127,119,221,0.45);
  --hdr-sub:         rgba(127,119,221,0.2);
  --live-color:      rgba(29,158,117,0.45);
  --hint-color:      rgba(127,119,221,0.35);
  --count-color:     rgba(127,119,221,0.18);
  --close-border:    rgba(127,119,221,0.2);
  --close-color:     rgba(232,230,248,0.4);
  --close-hover-bg:  rgba(127,119,221,0.12);
  --close-hover-bdr: rgba(127,119,221,0.45);
  --close-hover-col: #e8e6f8;
  --tag-border:      rgba(127,119,221,0.22);
  --tag-color:       rgba(127,119,221,0.55);
  --divider-bg:      rgba(127,119,221,0.1);
  --btn-border:      rgba(127,119,221,0.25);
  --btn-color:       rgba(232,230,248,0.5);
  --btn-hover-bg:    rgba(127,119,221,0.1);
  --btn-hover-bdr:   rgba(127,119,221,0.55);
  --btn-hover-col:   #e8e6f8;
  --btn-pri-bg:      rgba(127,119,221,0.1);
  --btn-pri-bdr:     rgba(127,119,221,0.4);
  --btn-pri-col:     #e8e6f8;
  --btn-pri-hbg:     rgba(127,119,221,0.2);
  --btn-pri-hbdr:    rgba(127,119,221,0.7);
  /* canvas draw colours (read by JS) */
  --canvas-bg:       9,8,14;
  --particle-rgb:    127,119,221;
  --blob-alpha:      0.011;
}

/* ── Light theme overrides ─────────────────────────────── */
body.light {
  --bg:              #f4f3fb;
  --card-bg:         rgba(255,255,255,0.97);
  --card-border:     rgba(100,90,200,0.22);
  --text-primary:    #1a1830;
  --text-secondary:  rgba(26,24,48,0.55);
  --text-muted:      rgba(26,24,48,0.38);
  --hdr-name:        rgba(83,74,183,0.6);
  --hdr-sub:         rgba(83,74,183,0.3);
  --live-color:      rgba(15,110,86,0.65);
  --hint-color:      rgba(83,74,183,0.4);
  --count-color:     rgba(83,74,183,0.25);
  --close-border:    rgba(83,74,183,0.18);
  --close-color:     rgba(26,24,48,0.4);
  --close-hover-bg:  rgba(83,74,183,0.08);
  --close-hover-bdr: rgba(83,74,183,0.45);
  --close-hover-col: #1a1830;
  --tag-border:      rgba(83,74,183,0.2);
  --tag-color:       rgba(83,74,183,0.65);
  --divider-bg:      rgba(83,74,183,0.1);
  --btn-border:      rgba(83,74,183,0.22);
  --btn-color:       rgba(26,24,48,0.5);
  --btn-hover-bg:    rgba(83,74,183,0.07);
  --btn-hover-bdr:   rgba(83,74,183,0.5);
  --btn-hover-col:   #1a1830;
  --btn-pri-bg:      rgba(83,74,183,0.08);
  --btn-pri-bdr:     rgba(83,74,183,0.35);
  --btn-pri-col:     #1a1830;
  --btn-pri-hbg:     rgba(83,74,183,0.15);
  --btn-pri-hbdr:    rgba(83,74,183,0.6);
  --canvas-bg:       244,243,251;
  --particle-rgb:    100,90,200;
  --blob-alpha:      0.018;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background 0.4s;
}

canvas#field {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: default;
}

#hdr {
  position: fixed;
  top: 26px; left: 32px;
  z-index: 20;
  pointer-events: none;
}
#hdr-name {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--hdr-name);
  transition: color 0.4s;
}
#hdr-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 300;
  font-style: italic;
  color: var(--hdr-sub);
  margin-top: 3px;
  letter-spacing: 0.07em;
  transition: color 0.4s;
}

#live-badge {
  position: fixed;
  top: 30px; right: 32px;
  z-index: 20;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 300;
  color: var(--live-color);
  letter-spacing: 0.1em;
  transition: color 0.4s;
}
#live-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #1D9E75;
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink {
  0%,100%{opacity:1} 50%{opacity:0.3}
}

#hint {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  pointer-events: none;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--hint-color);
  white-space: nowrap;
  transition: opacity 0.5s, color 0.4s;
}

#works-count {
  position: fixed;
  bottom: 28px; right: 32px;
  z-index: 20;
  pointer-events: none;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 300;
  color: var(--count-color);
  letter-spacing: 0.1em;
  transition: color 0.4s;
}

/* ── Theme toggle ──────────────────────────────────────── */
#theme-toggle {
  position: fixed;
  bottom: 22px; left: 32px;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  background: transparent;
  border: none;
  padding: 0;
}
#toggle-track {
  width: 36px; height: 20px;
  border-radius: 99px;
  border: 0.5px solid var(--hint-color);
  background: transparent;
  position: relative;
  transition: border-color 0.3s, background 0.3s;
  flex-shrink: 0;
}
#toggle-thumb {
  position: absolute;
  top: 3px; left: 3px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--hint-color);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
}
body.light #toggle-thumb {
  transform: translateX(16px);
}
#toggle-icon {
  font-size: 11px;
  color: var(--hint-color);
  transition: color 0.4s;
  user-select: none;
  line-height: 1;
}

/* Card overlay — centred, floating, pointer-events only on #card itself */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

#card {
  width: 360px;
  background: var(--card-bg);
  border: 0.5px solid var(--card-border);
  border-radius: 20px;
  padding: 30px 30px 26px;
  position: relative;
  pointer-events: all;
  opacity: 0;
  transform: scale(0.84) translateY(12px);
  transition: opacity 0.38s cubic-bezier(0.22,1,0.36,1),
              transform 0.38s cubic-bezier(0.22,1,0.36,1),
              background 0.4s, border-color 0.4s;
}
#card.show {
  opacity: 1;
  transform: scale(1) translateY(0);
}
#card:not(.show) {
  pointer-events: none;
}

#card-glow {
  position: absolute;
  top: 0; left: 30px; right: 30px;
  height: 1px;
  border-radius: 99px;
}

#close {
  position: absolute;
  top: 14px; right: 16px;
  width: 27px; height: 27px;
  border-radius: 50%;
  border: 0.5px solid var(--close-border);
  background: transparent;
  cursor: pointer;
  color: var(--close-color);
  font-size: 17px;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
#close:hover {
  background: var(--close-hover-bg);
  border-color: var(--close-hover-bdr);
  color: var(--close-hover-col);
}

#c-eye {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  margin-bottom: 10px;
  transition: color 0.3s;
}
#c-title {
  font-size: 22px;
  font-weight: 300;
  color: var(--text-primary);
  letter-spacing: -0.4px;
  line-height: 1.15;
  margin-bottom: 10px;
  transition: color 0.4s;
}
#c-desc {
  font-size: 13px;
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.65;
  margin-bottom: 16px;
  transition: color 0.4s;
}
#c-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 20px;
}
.ctag {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 300;
  padding: 3px 9px;
  border-radius: 99px;
  border: 0.5px solid var(--tag-border);
  color: var(--tag-color);
  letter-spacing: 0.04em;
  transition: border-color 0.4s, color 0.4s;
}

.divider {
  height: 0.5px;
  background: var(--divider-bg);
  margin-bottom: 20px;
  transition: background 0.4s;
}

#c-actions {
  display: flex;
  gap: 10px;
}
.cbtn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 11px 6px;
  border-radius: 10px;
  border: 0.5px solid var(--btn-border);
  color: var(--btn-color);
  background: transparent;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.16s, border-color 0.16s, color 0.16s;
}
.cbtn:hover {
  background: var(--btn-hover-bg);
  border-color: var(--btn-hover-bdr);
  color: var(--btn-hover-col);
}
.cbtn.primary {
  background: var(--btn-pri-bg);
  border-color: var(--btn-pri-bdr);
  color: var(--btn-pri-col);
}
.cbtn.primary:hover {
  background: var(--btn-pri-hbg);
  border-color: var(--btn-pri-hbdr);
}
.cbtn svg {
  width: 13px; height: 13px;
  flex-shrink: 0;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
</style>
</head>
<body>

<canvas id="field"></canvas>

<div id="hdr">
  <div id="hdr-name">nztdev</div>
  <div id="hdr-sub">field of works</div>
</div>

<div id="live-badge">
  <div id="live-dot"></div>
  <span>github.com/nztdev</span>
</div>

<div id="hint">select a node</div>
<div id="works-count"></div>

<button id="theme-toggle" aria-label="toggle light/dark theme">
  <div id="toggle-track"><div id="toggle-thumb"></div></div>
  <span id="toggle-icon">☀︎</span>
</button>

<div id="overlay">
  <div id="card">
    <div id="card-glow"></div>
    <button id="close" aria-label="close">×</button>
    <div id="c-eye"></div>
    <div id="c-title"></div>
    <div id="c-desc"></div>
    <div id="c-tags"></div>
    <div class="divider"></div>
    <div id="c-actions">
      <a class="cbtn primary" id="btn-gh" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        GitHub repo
      </a>
      <a class="cbtn" id="btn-io" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        live page
      </a>
    </div>
  </div>
</div>

<script>
(function () {

  /* ═══════════════════════════════════════════════════════
     DATA — to add a repo, append an object with the same
     shape. To remove, delete its object. To edit, change
     any field. The field recalculates everything at runtime.
     ═══════════════════════════════════════════════════════ */
  const REPOS = [
    {
      id: 0,
      name: 'B.O.S.S. Kernel',
      eye: 'biological kernel · JS / Python / HTML',
      desc: 'A resonant routing kernel treating AI intent as a biological pulse. Nodes warm to fire and decay before re-activation. The Soma gates the Cortex through thermal readiness and semantic alignment to prevent ungrounded actions.',
      tags: ['resonance physics', 'metabolic decay', 'sovereign AI', 'PWA', 'arbiter'],
      gh:  'https://github.com/nztdev/boss-kernel',
      io:  'https://nztdev.github.io/boss-kernel/core/',
      rgb: '127,119,221',
    },
    {
      id: 1,
      name: 'Resonance Signal',
      eye: 'electronic music intelligence · HTML',
      desc: 'Electronic music intelligence, alive and curated. A living feed that moves at the frequency of now — where the signal finds you before you find it.',
      tags: ['music intelligence', 'electronic', 'live feed', '2026'],
      gh:  'https://github.com/nztdev/resonance-signal',
      io:  'https://nztdev.github.io/resonance-signal/',
      rgb: '29,158,117',
    },
    {
      id: 2,
      name: 'B.O.S.S. Deliberate',
      eye: 'intentional interface · HTML',
      desc: 'The deliberate layer of the B.O.S.S. architecture. Intention is set before action is permitted. Slow thought made visible — the counterweight to impulse in the resonant system.',
      tags: ['intentional UI', 'somatic design', 'B.O.S.S.', 'paced action'],
      gh:  'https://github.com/nztdev/boss-deliberate',
      io:  'https://nztdev.github.io/boss-deliberate/',
      rgb: '239,159,39',
    },
    {
      id: 3,
      name: 'GitWire',
      eye: 'github intelligence briefing · HTML',
      desc: 'A weekly AI-powered GitHub intelligence publication. GitWire scans trending repositories, selects editorial picks, and writes Signal, Under the Hood, The Idea, Fresh Drops, and Resurrection sections — live, via Gemini. GitHub as a newspaper.',
      tags: ['AI editorial', 'GitHub trends', 'Gemini', 'weekly briefing', 'intelligence'],
      gh:  'https://github.com/nztdev/GitWire',
      io:  'https://nztdev.github.io/GitWire/',
      rgb: '0,200,255',
    },
    {
      id: 4,
      name: 'The nᵗʰ Life',
      eye: 'brutalist AI life simulator · HTML / JS',
      desc: 'A brutalist, AI-driven life simulator built for 2026 tactical realism. Every action has consequences — Gemini generates non-sugarcoated outcomes in real-time. Permadeath roguelike mode with live stat tracking, cloud saves via Supabase, and a global leaderboard. Your timeline ends. It is scored. It is archived.',
      tags: ['life simulator', 'permadeath', 'Gemini 2.5', 'Supabase', 'roguelike', 'PWA'],
      gh:  'https://github.com/thenthlife/thenthlife.github.io',
      io:  'https://thenthlife.github.io',
      rgb: '220,38,38',
    },
  ];
  /* ═══════════════════════════════════════════════════════ */

  const canvas  = document.getElementById('field');
  const ctx     = canvas.getContext('2d');
  const card    = document.getElementById('card');
  const hint    = document.getElementById('hint');
  const closBtn = document.getElementById('close');

  document.getElementById('works-count').textContent = REPOS.length + ' works';

  /* ── Theme toggle ─────────────────────────────────────── */
  let isLight = false;
  const toggleBtn  = document.getElementById('theme-toggle');
  const toggleIcon = document.getElementById('toggle-icon');

  const THEME = {
    dark:  { bg: '9,8,14',       pt: '127,119,221', blobA: 0.011 },
    light: { bg: '244,243,251',  pt: '100,90,200',  blobA: 0.018 },
  };

  function currentTheme() { return isLight ? THEME.light : THEME.dark; }

  toggleBtn.addEventListener('click', () => {
    isLight = !isLight;
    document.body.classList.toggle('light', isLight);
    toggleIcon.textContent = isLight ? '☽' : '☀︎';
  });

  let W, H, t = 0, activeId = -1, locked = false;

  /* nodes — built from REPOS at startup */
  const nodes = REPOS.map((r, i) => ({
    repo: r,
    x: 0, y: 0, tx: 0, ty: 0,
    radius: 24, targetR: 24,
    orbitAngle: (i / REPOS.length) * Math.PI * 2 - Math.PI / 2,
    orbitSpeed: (0.00022 + Math.random() * 0.00014) * (i % 2 === 0 ? 1 : -1),
    pulse: Math.random() * Math.PI * 2,
  }));

  /* ambient particles */
  const PCOUNT = 65;
  const pts = [];
  function spawnPts() {
    pts.length = 0;
    for (let i = 0; i < PCOUNT; i++) {
      pts.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.19,
        vy: (Math.random() - 0.5) * 0.19,
        r:  Math.random() * 1.3 + 0.2,
        a:  Math.random() * 0.18 + 0.03,
        ph: Math.random() * Math.PI * 2,
      });
    }
  }

  const CX = () => W / 2;
  const CY = () => H / 2;
  const OR = () => Math.min(W, H) * 0.26;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    spawnPts();
    if (activeId < 0) resetOrbits(true);
  }
  resize();
  window.addEventListener('resize', resize);

  function resetOrbits(snap) {
    nodes.forEach(n => {
      n.tx = CX() + Math.cos(n.orbitAngle) * OR();
      n.ty = CY() + Math.sin(n.orbitAngle) * OR();
      n.targetR = 24;
      if (snap) { n.x = n.tx; n.y = n.ty; n.radius = 24; }
    });
  }
  resetOrbits(true);

  /* ── Activate ─────────────────────────────────────────── */
  function activate(id) {
    if (locked) return;
    locked = true;
    activeId = id;
    hint.style.opacity = '0';
    nodes.forEach(n => {
      if (n.repo.id === id) {
        n.tx = CX(); n.ty = CY(); n.targetR = 94;
      } else {
        const push = OR() * 1.8;
        n.tx = CX() + Math.cos(n.orbitAngle) * push;
        n.ty = CY() + Math.sin(n.orbitAngle) * push;
        n.targetR = 13;
      }
    });
    setTimeout(() => {
      showCard(REPOS.find(r => r.id === id));
      locked = false;
    }, 480);
  }

  /* ── Deactivate ───────────────────────────────────────── */
  function deactivate() {
    if (locked) return;
    locked = true;
    card.classList.remove('show');
    activeId = -1;
    nodes.forEach(n => { n.targetR = 24; });
    hint.style.opacity = '1';
    setTimeout(() => { locked = false; }, 400);
  }

  /* ── Populate card ────────────────────────────────────── */
  function showCard(repo) {
    document.getElementById('c-eye').textContent   = repo.eye;
    document.getElementById('c-eye').style.color   = `rgba(${repo.rgb},0.65)`;
    document.getElementById('c-title').textContent = repo.name;
    document.getElementById('c-desc').textContent  = repo.desc;
    document.getElementById('c-tags').innerHTML    = repo.tags
      .map(t => `<span class="ctag">${t}</span>`).join('');
    document.getElementById('btn-gh').href = repo.gh;
    document.getElementById('btn-io').href = repo.io;
    document.getElementById('card-glow').style.background =
      `linear-gradient(90deg,transparent,rgba(${repo.rgb},0.5),transparent)`;
    card.style.borderColor = `rgba(${repo.rgb},0.32)`;
    requestAnimationFrame(() => card.classList.add('show'));
  }

  /* ── Events ───────────────────────────────────────────── */
  closBtn.addEventListener('click', deactivate);

  canvas.addEventListener('click', e => {
    if (locked || activeId >= 0) return;
    for (const n of nodes) {
      const dx = e.clientX - n.x, dy = e.clientY - n.y;
      if (Math.sqrt(dx * dx + dy * dy) < n.radius + 14) {
        activate(n.repo.id); return;
      }
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (activeId >= 0 || locked) { canvas.style.cursor = 'default'; return; }
    let hit = false;
    for (const n of nodes) {
      const dx = e.clientX - n.x, dy = e.clientY - n.y;
      if (Math.sqrt(dx * dx + dy * dy) < n.radius + 14) { hit = true; break; }
    }
    canvas.style.cursor = hit ? 'pointer' : 'default';
  });

  /* ── Draw loop ────────────────────────────────────────── */
  const EASE = 0.066;
  const lerp  = (a, b, k) => a + (b - a) * k;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.012;
    const cx = CX(), cy = CY();

    /* canvas background fill — matches body theme */
    const { bg: bgRgb, pt: ptRgb, blobA: blobAlpha } = currentTheme();

    ctx.fillStyle = `rgb(${bgRgb})`;
    ctx.fillRect(0, 0, W, H);

    /* slow ambient atmosphere blobs */
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(
        cx + Math.sin(t * 0.06 + i * 2.1) * W * 0.28,
        cy + Math.cos(t * 0.045 + i * 1.8) * H * 0.22,
        Math.min(W, H) * (0.32 + i * 0.1), 0, Math.PI * 2
      );
      ctx.fillStyle = `rgba(${i === 1 ? '29,158,117' : ptRgb},${blobAlpha + i * 0.004})`;
      ctx.fill();
    }

    /* particles */
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${ptRgb},${p.a * (0.5 + 0.5 * Math.sin(t * 0.8 + p.ph))})`;
      ctx.fill();
    });

    /* particle web */
    for (let i = 0; i < pts.length; i += 2) {
      for (let j = i + 2; j < pts.length; j += 2) {
        const a = pts[i], b = pts[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < 115) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(${ptRgb},${(1 - d / 115) * 0.028})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    /* idle orbit tick */
    if (activeId < 0) {
      nodes.forEach(n => {
        n.orbitAngle += n.orbitSpeed;
        n.tx = cx + Math.cos(n.orbitAngle) * OR();
        n.ty = cy + Math.sin(n.orbitAngle) * OR();
      });
    }

    /* lerp all nodes */
    nodes.forEach(n => {
      n.x      = lerp(n.x,      n.tx,      EASE);
      n.y      = lerp(n.y,      n.ty,      EASE);
      n.radius = lerp(n.radius, n.targetR, EASE);
    });

    /* node–node edges */
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        const md = Math.min(W, H);
        if (d < md) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(${ptRgb},${(1 - d / md) * 0.13 * (0.6 + 0.4 * Math.sin(t + i))})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    /* active: pulse line + travelling dot to origin */
    nodes.forEach(n => {
      if (n.repo.id !== activeId) return;
      ctx.beginPath();
      ctx.moveTo(cx, cy); ctx.lineTo(n.x, n.y);
      ctx.strokeStyle = `rgba(${n.repo.rgb},0.07)`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
      const prog = (t * 0.5) % 1;
      ctx.beginPath();
      ctx.arc(cx + (n.x - cx) * prog, cy + (n.y - cy) * prog, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${n.repo.rgb},0.7)`;
      ctx.fill();
    });

    /* nodes */
    nodes.forEach(n => {
      const r  = n.repo;
      const ia = r.id === activeId;
      const pv = 0.65 + 0.35 * Math.sin(t * 1.1 + n.pulse);

      /* outer breathing ring */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + 7 + 5 * Math.sin(t * 1.3 + n.pulse), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${r.rgb},${ia ? 0.2 * pv : 0.06 * pv})`;
      ctx.lineWidth   = ia ? 1.5 : 0.5;
      ctx.stroke();

      /* inner ring */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + 2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${r.rgb},${ia ? 0.35 : 0.11 * pv})`;
      ctx.lineWidth   = 0.5;
      ctx.stroke();

      /* core */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
      ctx.fillStyle   = `rgba(${r.rgb},${ia ? 0.14 : 0.06})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${r.rgb},${ia ? 0.8 : 0.3 * pv})`;
      ctx.lineWidth   = ia ? 1 : 0.5;
      ctx.stroke();

      /* label */
      ctx.font         = `400 ${ia ? 13 : 11}px 'DM Mono', monospace`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = `rgba(${r.rgb},${ia ? 0.9 : 0.55})`;
      if (ia) {
        const w = r.name.split(' ');
        w.length <= 2
          ? ctx.fillText(r.name, n.x, n.y)
          : (ctx.fillText(w.slice(0, 2).join(' '), n.x, n.y - 9),
             ctx.fillText(w.slice(2).join(' '),     n.x, n.y + 9));
      } else {
        const parts = r.name.split(' ');
        const shortLabel = parts.length > 2 ? parts.slice(-2).join(' ') : parts[parts.length - 1];
        ctx.fillText(shortLabel, n.x, n.y);
      }
    });

    /* origin pulse */
    ctx.beginPath();
    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${ptRgb},${0.14 + 0.1 * Math.sin(t)})`;
    ctx.fill();

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
