#res-menu-ok:hover { background:rgba(127,119,221,0.22); }
#res-status { font-family:var(--mono); font-size:9px; letter-spacing:0.1em; color:rgba(127,119,221,0.5); text-align:center; display:none; }

/* Card overlay */
#overlay { position:absolute; top:0; left:0; right:0; bottom:0; z-index:40; display:flex; align-items:center; justify-content:center; pointer-events:none; }
#card { width:340px; max-width:calc(100% - 40px); background:var(--card-bg); border:0.5px solid var(--card-border); border-radius:20px; padding:28px 28px 24px; position:relative; pointer-events:all; opacity:0; transform:scale(0.84) translateY(12px); transition:opacity 0.36s cubic-bezier(0.22,1,0.36,1), transform 0.36s cubic-bezier(0.22,1,0.36,1), background 0.4s, border-color 0.4s; }
#card.show { opacity:1; transform:scale(1) translateY(0); }
#card:not(.show) { pointer-events:none; }

#card-close { position:absolute; top:12px; right:14px; width:26px; height:26px; border-radius:50%; border:0.5px solid rgba(127,119,221,0.2); background:transparent; cursor:pointer; color:rgba(232,230,248,0.4); font-size:16px; display:flex; align-items:center; justify-content:center; transition:background 0.15s, border-color 0.15s; }

#card-close:hover { background:rgba(127,119,221,0.1); border-color:rgba(127,119,221,0.45); }

/* Card favicon + name row */

.cbtn:hover { background:rgba(127,119,221,0.1); border-color:rgba(127,119,221,0.55); color:var(--text); }

/* ═══════════════════════════════════════════════════
   FAVICON SYSTEM
   Loads favicons async from Google's favicon service.
   Validates real favicons by checking they aren't the
   generic 16×16 fallback globe.
   faviconMap[repoId] = HTMLImageElement (only if valid)
═══════════════════════════════════════════════════ */
var faviconMap = {};      /* repoId → Image */
var offscreen  = document.createElement('canvas');
offscreen.width = offscreen.height = 1;
var offCtx = offscreen.getContext('2d');

/* Fingerprint of Google's generic fallback (1×1 sample pixel) */
var FALLBACK_PRINT = null;

function getFaviconUrl(domain) {
    var googleUrl = 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=64';
    // This prepends a proxy that adds the missing CORS headers on the fly
    return 'https://corsproxy.io/?' + encodeURIComponent(googleUrl);
}

function domainFromUrl(url) {
  try { return new URL(url).hostname; }
  catch (e) { return null; }
}

/* Load the known fallback first so we can compare against it */
function loadFallbackPrint(cb) {
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function () {
    try {
      offscreen.width = img.width; offscreen.height = img.height;
      offCtx.drawImage(img, 0, 0);
      var d = offCtx.getImageData(0, 0, img.width, img.height).data;
      FALLBACK_PRINT = d[0] + ',' + d[1] + ',' + d[2] + ',' + d[3];
    } catch (e) { FALLBACK_PRINT = '__none__'; }
    cb();
  };
  img.onerror = function () { FALLBACK_PRINT = '__none__'; cb(); };
  /* Use a domain that definitely has no real favicon */
  img.src = getFaviconUrl('this-domain-does-not-exist-nztdev-fallback.invalid');
}

function loadFavicon(repo) {
  var domain = domainFromUrl(repo.io);
  if (!domain) return;
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function () {
    /* Reject tiny images (16×16 or smaller — Google's generic fallback) */
    if (img.width <= 16 && img.height <= 16) return;
    /* Also compare pixel fingerprint if fallback was loaded */
    if (FALLBACK_PRINT && FALLBACK_PRINT !== '__none__') {
      try {
        offscreen.width = img.width; offscreen.height = img.height;
        offCtx.drawImage(img, 0, 0);
        var d = offCtx.getImageData(0, 0, img.width, img.height).data;
        var fp = d[0] + ',' + d[1] + ',' + d[2] + ',' + d[3];
        if (fp === FALLBACK_PRINT) return;
      } catch (e) { /* cross-origin taint — proceed anyway, size check passed */ }
    }
    faviconMap[repo.id] = img;
  };
  img.onerror = function () { /* no favicon — silent fail */ };
  img.src = getFaviconUrl(domain);
}

function initFavicons() {
  loadFallbackPrint(function () {
    for (var i = 0; i < REPOS.length; i++) { loadFavicon(REPOS[i]); }
  });
}

function makeNode(entity, index, total, baseRadius) {
  return {
    entity:     entity,
    isGroup:    GROUPS.indexOf(entity) >= 0,
    x:0, y:0, tx:0, ty:0,
    radius:     baseRadius || 26,
    targetR:    baseRadius || 26,
    baseR:      baseRadius || 26,
    orbitAngle: (index / total) * Math.PI * 2 - Math.PI / 2,
    orbitSpeed: (0.00020 + Math.random() * 0.00014) * (index % 2 === 0 ? 1 : -1),
    pulse:      Math.random() * Math.PI * 2,
  };
}

function buildRootNodes() {
  var items = [], i;
  for (i = 0; i < GROUPS.length; i++) { items.push({ entity:GROUPS[i], isGroup:true }); }
  for (i = 0; i < REPOS.length;  i++) { if (REPOS[i].groupId === null) { items.push({ entity:REPOS[i], isGroup:false }); } }
  rootNodes = [];
  for (i = 0; i < items.length; i++) {
    var n = makeNode(items[i].entity, i, items.length, items[i].isGroup ? 30 : 24);
    n.isGroup = items[i].isGroup;
    rootNodes.push(n);
  }
}

function buildFlatNodes() {
  rootNodes = [];
  for (var i = 0; i < REPOS.length; i++) {
    var n = makeNode(REPOS[i], i, REPOS.length, 22);
    n.isGroup = false;
    rootNodes.push(n);
  }
}

function buildChildNodes(group) {
  var members = [], i;
  for (i = 0; i < REPOS.length; i++) { if (REPOS[i].groupId === group.id) { members.push(REPOS[i]); } }
  childNodes = [];
  for (i = 0; i < members.length; i++) { childNodes.push(makeNode(members[i], i, members.length, 22)); }
}

function applyViewMode(snap) {
  if (flatMode) { buildFlatNodes(); } else { buildRootNodes(); }
  resetNodes(rootNodes, CX(), CY(), OR, snap);
}

buildRootNodes();

function resetNodes(pool, cx, cy, radiusFn, snap) {
  var or = radiusFn();
  pool.forEach(function (n) {
    n.tx = cx + Math.cos(n.orbitAngle)*or;
    n.ty = cy + Math.sin(n.orbitAngle)*or;
    n.targetR = n.baseR;
    if (snap) { n.x=n.tx; n.y=n.ty; n.radius=n.baseR; }
  });
}

  var s = measure(); W=s.w; H=s.h;

   RESONANCE MODULE

var _cache = {};
function apiRepo(repo) {
  var slug = repo.ghOwner+'/'+repo.ghRepo;
  if (_cache[slug]) { return Promise.resolve(_cache[slug]); }
  return new Promise(function (resolve) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET','https://api.github.com/repos/'+slug);
    xhr.setRequestHeader('Accept','application/vnd.github+json');
    xhr.onload = function () { try { var d=JSON.parse(xhr.responseText); _cache[slug]=d; resolve(d); } catch(e){resolve(null);} };
    xhr.onerror = function () { resolve(null); };
    xhr.send();
  });
}
function apiCommits(repo) {
  var slug = repo.ghOwner+'/'+repo.ghRepo;
  return new Promise(function (resolve) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET','https://api.github.com/repos/'+slug+'/commits?per_page=1');
    xhr.setRequestHeader('Accept','application/vnd.github+json');
    xhr.onload = function () {
      var link=xhr.getResponseHeader('Link')||'';
      var m=link.match(/[?&]page=(\d+)>; rel="last"/);
      if (m) { resolve(parseInt(m[1],10)); return; }
      try { var d=JSON.parse(xhr.responseText); resolve(Array.isArray(d)?d.length:1); } catch(e){resolve(1);}
    };
    xhr.onerror=function(){resolve(1);}; xhr.send();
  });
}
var METRICS = {
  commits:  { fetch: apiCommits },
  stars:    { fetch: function(r){return apiRepo(r).then(function(d){return(d&&d.stargazers_count)||0;});} },
  forks:    { fetch: function(r){return apiRepo(r).then(function(d){return(d&&d.forks_count)||0;});} },
  watchers: { fetch: function(r){return apiRepo(r).then(function(d){return(d&&d.watchers_count)||0;});} },
};
var Res = {
  active:false, loading:false, metric:'commits', scores:{}, norms:{}, groupScores:{}, groupNorms:{},
  SMIN:14, SMAX:46,
  rMin:function(){return Math.min(W,H)*0.09;},
  rMax:function(){return Math.min(W,H)*0.38;},

  _pool:function(){
    if (scene===SCENE_GROUP&&activeGroup) { return REPOS.filter(function(r){return r.groupId===activeGroup.id;}); }
    return REPOS;
  },

  start:function(metric){
    var self=this;
    if (self.loading) return;
    self.metric=metric; self.loading=true; self.active=false;
    resStatus.style.display='block'; resStatus.textContent='fetching\u2026'; resOK.disabled=true;
    var def=METRICS[self.metric]; if (!def){self.loading=false;return;}
    var pool=self._pool(), pending=pool.length, results=[];
    if (!pending){self.loading=false;return;}
    function done(id,val){ results.push({id:id,val:val||0}); pending--; if(!pending){self._finish(results);} }
    pool.forEach(function(r){ def.fetch(r).then(function(v){done(r.id,v);})['catch'](function(){done(r.id,0);}); });
  },

  _finish:function(results){
    var self=this, i, j;
    results.forEach(function(item){self.scores[item.id]=item.val;});
    var vals=results.map(function(r){return r.val;});
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), sp=mx-mn||1;
    results.forEach(function(item){self.norms[item.id]=(item.val-mn)/sp;});
    self.groupScores={};
    for(i=0;i<GROUPS.length;i++){
      var g=GROUPS[i], tot=0, cnt=0;
      for(j=0;j<REPOS.length;j++){if(REPOS[j].groupId===g.id&&self.scores[REPOS[j].id]!==undefined){tot+=self.scores[REPOS[j].id];cnt++;}}
      self.groupScores[g.id]=cnt>0?tot:0;
    }
    var gv=GROUPS.map(function(g){return self.groupScores[g.id]||0;});
    var gmn=Math.min.apply(null,gv), gmx=Math.max.apply(null,gv), gsp=gmx-gmn||1;
    self.groupNorms={};
    for(i=0;i<GROUPS.length;i++){self.groupNorms[GROUPS[i].id]=((self.groupScores[GROUPS[i].id]||0)-gmn)/gsp;}
    self.loading=false; self.active=true;
    resStatus.style.display='none'; resOK.disabled=false;
    resBtn.classList.add('on'); document.getElementById('res-lbl').textContent='resonating';
    closeMenu(); self._apply();
  },

  stop:function(){
    this.active=false; this.loading=false;
    resBtn.classList.remove('on'); document.getElementById('res-lbl').textContent='Resonate';
    resStatus.style.display='none'; resOK.disabled=false;
    var pool=scene===SCENE_GROUP?childNodes:rootNodes;
    pool.forEach(function(n){n.targetR=n.baseR;});
  },

  _apply:function(){
    if (!this.active) return;
    var self=this, cx=CX(), cy=CY();
    var pool=scene===SCENE_GROUP?childNodes:rootNodes;
    pool.forEach(function(n){
      var norm=n.isGroup
        ?(self.groupNorms[n.entity.id]!==undefined?self.groupNorms[n.entity.id]:0.5)
        :(self.norms[n.entity.id]!==undefined?self.norms[n.entity.id]:0.5);
      n.targetR=self.SMIN+norm*(self.SMAX-self.SMIN);
      var dist=self.rMax()-norm*(self.rMax()-self.rMin());
      if (scene===SCENE_GROUP){dist=Math.min(dist,CR()*1.6);}
      n.tx=cx+Math.cos(n.orbitAngle)*dist;
      n.ty=cy+Math.sin(n.orbitAngle)*dist;
    });
  },

  tick:function(){if(this.active){this._apply();}},

  badges:function(){
    if (!this.active) return;
    var self=this;
    var pool=scene===SCENE_GROUP?childNodes:rootNodes;
    pool.forEach(function(n){
      var raw=n.isGroup?self.groupScores[n.entity.id]:self.scores[n.entity.id];
      if (raw===undefined) return;
      var lbl=raw>=1000?(raw/1000).toFixed(1)+'k':String(raw);
      ctx.font='300 9px \'DM Mono\',monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgba('+n.entity.rgb+',0.6)';
      ctx.fillText(lbl, n.x, n.y+n.radius+14);
    });
  },
};

/* ── Hit test ───────────────────────────────────── */
function hitTest(mx,my){
  var pool=(scene===SCENE_GROUP)?childNodes:rootNodes;
  for(var i=0;i<pool.length;i++){
    var n=pool[i], dx=mx-n.x, dy=my-n.y;
    if(Math.sqrt(dx*dx+dy*dy)<n.radius+16){return n;}
  }
  return null;
}
function handleTap(mx,my){
  if(locked||scene===SCENE_CARD)return;
  var n=hitTest(mx,my); if(!n)return;
  if(n.isGroup){goToGroup(n.entity);}else{openRepoCard(n.entity);}
}
canvas.addEventListener('click',function(e){
  var r=canvas.getBoundingClientRect(); handleTap(e.clientX-r.left,e.clientY-r.top);
});
canvas.addEventListener('mousemove',function(e){
  if(scene===SCENE_CARD||locked){canvas.style.cursor='default';return;}
  var r=canvas.getBoundingClientRect();
  canvas.style.cursor=hitTest(e.clientX-r.left,e.clientY-r.top)?'pointer':'default';
});
canvas.addEventListener('touchend',function(e){
  var touch=e.changedTouches[0], r=canvas.getBoundingClientRect();
  var mx=touch.clientX-r.left, my=touch.clientY-r.top;
  if(locked||scene===SCENE_CARD)return;
  var n=hitTest(mx,my);
  if(n){e.preventDefault();if(n.isGroup){goToGroup(n.entity);}else{openRepoCard(n.entity);}}
},{passive:false});

/* ═══════════════════════════════════════════════════
   DRAW LOOP
═══════════════════════════════════════════════════ */
var EASE=0.066;
function lerp(a,b,k){return a+(b-a)*k;}

/* Draw a favicon clipped to a circle inside a node */
function drawFavicon(img, nx, ny, nodeR) {
  var fSize = Math.floor(nodeR * 0.72);  /* favicon fills ~72% of node radius */
  if (fSize < 6) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(nx, ny - fSize*0.18, fSize*0.72, 0, Math.PI*2);  /* sit slightly above centre */
  ctx.clip();
  ctx.drawImage(img, nx - fSize*0.72, ny - fSize*0.18 - fSize*0.72, fSize*1.44, fSize*1.44);
  ctx.restore();
}

function drawNodeSet(pool, cx, cy, T) {
  var i, j, md=Math.min(W,H);

  /* Edges */
  for(i=0;i<pool.length;i++){
    for(j=i+1;j<pool.length;j++){
      var na=pool[i], nb=pool[j];
      var ex=na.x-nb.x, ey=na.y-nb.y, ed=Math.sqrt(ex*ex+ey*ey);
      if(ed<md){
        ctx.beginPath(); ctx.moveTo(na.x,na.y); ctx.lineTo(nb.x,nb.y);
        ctx.strokeStyle='rgba('+T.pt+','+((1-ed/md)*0.11*(0.6+0.4*Math.sin(t+i)))+')';
        ctx.lineWidth=0.5; ctx.stroke();
      }
    }
  }

  /* Pulse line to active repo */
  if(scene===SCENE_CARD&&activeRepo){
    pool.forEach(function(n){
      if(n.entity!==activeRepo)return;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(n.x,n.y);
      ctx.strokeStyle='rgba('+n.entity.rgb+',0.06)'; ctx.lineWidth=0.5; ctx.stroke();
      var pr=(t*0.5)%1;
      ctx.beginPath(); ctx.arc(cx+(n.x-cx)*pr,cy+(n.y-cy)*pr,2.5,0,Math.PI*2);
      ctx.fillStyle='rgba('+n.entity.rgb+',0.7)'; ctx.fill();
    });
  }

  /* Nodes */
  pool.forEach(function(n){
    var rgb=n.entity.rgb;
    var isAct=scene===SCENE_CARD&&n.entity===activeRepo;
    var pv=0.65+0.35*Math.sin(t*1.1+n.pulse);
    var hasFavi = !n.isGroup && faviconMap[n.entity.id];

    /* Outer breathing ring */
    ctx.beginPath(); ctx.arc(n.x,n.y,n.radius+7+5*Math.sin(t*1.3+n.pulse),0,Math.PI*2);
    ctx.strokeStyle='rgba('+rgb+','+(isAct?0.22*pv:0.06*pv)+')';
    ctx.lineWidth=isAct?1.5:0.5; ctx.stroke();

    /* Dashed ring for group nodes */
    if(n.isGroup&&scene===SCENE_ROOT){
      ctx.beginPath(); ctx.arc(n.x,n.y,n.radius+3,0,Math.PI*2);
      ctx.setLineDash([3,4]);
      ctx.strokeStyle='rgba('+rgb+',0.25)'; ctx.lineWidth=0.5; ctx.stroke();
      ctx.setLineDash([]);
    }

    /* Inner ring */
    ctx.beginPath(); ctx.arc(n.x,n.y,n.radius+2,0,Math.PI*2);
    ctx.strokeStyle='rgba('+rgb+','+(isAct?0.38:0.12*pv)+')'; ctx.lineWidth=0.5; ctx.stroke();

    /* Core fill */
    ctx.beginPath(); ctx.arc(n.x,n.y,n.radius,0,Math.PI*2);
    ctx.fillStyle='rgba('+rgb+','+(isAct?0.16:n.isGroup?0.09:0.06)+')'; ctx.fill();
    ctx.strokeStyle='rgba('+rgb+','+(isAct?0.82:0.32*pv)+')';
    ctx.lineWidth=isAct?1:0.5; ctx.stroke();

    /* Favicon inside node (repo nodes only, when loaded) */
    if(hasFavi&&n.radius>10){
      drawFavicon(faviconMap[n.entity.id], n.x, n.y, n.radius);
    }

    /* Label — below node if favicon present, centred if not */
    var fsize=isAct?12:(n.isGroup?11:10);
    ctx.font='400 '+fsize+'px \'DM Mono\',monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba('+rgb+','+(isAct?0.9:n.isGroup?0.7:0.55)+')';

    /* When favicon is shown, push label below the node circle */
    var labelY = hasFavi ? n.y + n.radius + 11 : n.y;
    if(isAct){
      ctx.textBaseline='middle';
      var ws=n.entity.name.split(' ');
      if(ws.length<=2){ ctx.fillText(n.entity.name,n.x,labelY); }
      else{ ctx.fillText(ws.slice(0,2).join(' '),n.x,labelY-8); ctx.fillText(ws.slice(2).join(' '),n.x,labelY+8); }
    } else {
      var label=n.isGroup?n.entity.name:(function(){
        var ps=n.entity.name.split(' ');
        return ps.length>2?ps.slice(-2).join(' '):ps[ps.length-1];
      }());
      ctx.fillText(label,n.x,labelY);
    }

    /* Count badge on group nodes (below label) */
    if(n.isGroup&&scene===SCENE_ROOT){
      var count=0;
      for(var ri=0;ri<REPOS.length;ri++){if(REPOS[ri].groupId===n.entity.id){count++;}}
      ctx.font='300 8px \'DM Mono\',monospace';
      ctx.fillStyle='rgba('+rgb+',0.4)';
      ctx.fillText(count+(count===1?' work':' works'),n.x,n.y+n.radius+12);
    }
  });
}

function draw(){
  requestAnimationFrame(draw);
  if(!sizeReady||W<10||H<10){
    var s=measure();
    if(s.w>10&&s.h>10){W=s.w;H=s.h;canvas.width=W;canvas.height=H;sizeReady=true;spawnPts();applyViewMode(true);}
    return;
  }
  ctx.clearRect(0,0,W,H); t+=0.012;
  var cx=CX(), cy=CY(), T=th();

  /* Background */
  ctx.fillStyle='rgb('+T.bg+')'; ctx.fillRect(0,0,W,H);

  /* Ambient blobs */
  for(var bi=0;bi<3;bi++){
    ctx.beginPath();
    ctx.arc(cx+Math.sin(t*0.06+bi*2.1)*W*0.28, cy+Math.cos(t*0.045+bi*1.8)*H*0.22, Math.min(W,H)*(0.32+bi*0.1),0,Math.PI*2);
    ctx.fillStyle='rgba('+(bi===1?'29,158,117':T.pt)+','+(T.bA+bi*0.004)+')'; ctx.fill();
  }

  /* Particles */
  for(var pi=0;pi<pts.length;pi++){
    var p=pts[pi]; p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba('+T.pt+','+(p.a*(0.5+0.5*Math.sin(t*0.8+p.ph)))+')'; ctx.fill();
  }

  /* Particle web */
  for(var wi=0;wi<pts.length;wi+=2){
    for(var wj=wi+2;wj<pts.length;wj+=2){
      var pa=pts[wi],pb=pts[wj],wdx=pa.x-pb.x,wdy=pa.y-pb.y,wd=Math.sqrt(wdx*wdx+wdy*wdy);
      if(wd<115){
        ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y);
        ctx.strokeStyle='rgba('+T.pt+','+((1-wd/115)*0.028)+')'; ctx.lineWidth=0.5; ctx.stroke();
      }
    }
  }

  /* Orbit ticks */
  var activePool=(scene===SCENE_GROUP||(scene===SCENE_CARD&&activeGroup))?childNodes:rootNodes;
  var orFn=activeGroup?CR:OR;
  if(scene!==SCENE_CARD){
    if(Res.active){
      activePool.forEach(function(n){n.orbitAngle+=n.orbitSpeed*0.4;});
      Res.tick();
    } else {
      var orV=orFn();
      activePool.forEach(function(n){
        n.orbitAngle+=n.orbitSpeed;
        if(scene===SCENE_ROOT||scene===SCENE_GROUP){n.tx=cx+Math.cos(n.orbitAngle)*orV;n.ty=cy+Math.sin(n.orbitAngle)*orV;}
      });
      if(scene===SCENE_GROUP){rootNodes.forEach(function(n){n.orbitAngle+=n.orbitSpeed*0.2;});}
    }
  }

  /* Lerp */
  function lerpPool(pool){pool.forEach(function(n){n.x=lerp(n.x,n.tx,EASE);n.y=lerp(n.y,n.ty,EASE);n.radius=lerp(n.radius,n.targetR,EASE);});}
  lerpPool(rootNodes);
  if(childNodes.length){lerpPool(childNodes);}

  /* Faded root nodes when inside group */
  if(scene===SCENE_GROUP||(scene===SCENE_CARD&&activeGroup)){
    rootNodes.forEach(function(n){
      ctx.globalAlpha=0.18;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.radius,0,Math.PI*2);
      ctx.fillStyle='rgba('+n.entity.rgb+',0.04)'; ctx.fill();
      ctx.strokeStyle='rgba('+n.entity.rgb+',0.15)'; ctx.lineWidth=0.5; ctx.stroke();
      ctx.globalAlpha=1;
    });
  }

  /* Draw active pool */
  if(scene===SCENE_ROOT||(scene===SCENE_CARD&&!activeGroup)){drawNodeSet(rootNodes,cx,cy,T);}
  else{drawNodeSet(childNodes,cx,cy,T);}

  /* Origin pulse */
  ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2);
  ctx.fillStyle='rgba('+T.pt+','+(0.14+0.1*Math.sin(t))+')'; ctx.fill();

  /* Resonance badges */
  Res.badges();
}

/* Start favicons and draw */
initFavicons();
draw();

}());
</script>
