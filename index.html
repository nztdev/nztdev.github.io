      vy: (Math.random() - 0.5) * 0.19,
      r: Math.random() * 1.3 + 0.2,
      a: Math.random() * 0.18 + 0.03,
      ph: Math.random() * Math.PI * 2
    });
  }
}
spawnPts();

function CX() { return W / 2; }
function CY() { return H / 2; }
function OR() { return Math.min(W, H) * 0.26; }

/* ═══════════════════════════════════════════════════
   RESONANCE MODULE
   To add a metric: one entry in METRICS with
   { label, fetch(repo)→Promise<number> }. Done.
═══════════════════════════════════════════════════ */
var _cache = {};
function apiRepo(repo) {
  var slug = repo.ghOwner + '/' + repo.ghRepo;
  if (_cache[slug]) { return Promise.resolve(_cache[slug]); }
  return new Promise(function (resolve) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.github.com/repos/' + slug);
    xhr.setRequestHeader('Accept', 'application/vnd.github+json');
    xhr.onload = function () {
      try {
        var d = JSON.parse(xhr.responseText);
        _cache[slug] = d;
        resolve(d);
      } catch (e) { resolve(null); }
    };
    xhr.onerror = function () { resolve(null); };
    xhr.send();
  });
}

function apiCommits(repo) {
  var slug = repo.ghOwner + '/' + repo.ghRepo;
  return new Promise(function (resolve) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.github.com/repos/' + slug + '/commits?per_page=1');
    xhr.setRequestHeader('Accept', 'application/vnd.github+json');
    xhr.onload = function () {
      var link = xhr.getResponseHeader('Link') || '';
      var m = link.match(/[?&]page=(\d+)>; rel="last"/);
      if (m) { resolve(parseInt(m[1], 10)); return; }
      try { var d = JSON.parse(xhr.responseText); resolve(Array.isArray(d) ? d.length : 1); }
      catch (e) { resolve(1); }
    };
    xhr.onerror = function () { resolve(1); };
    xhr.send();
  });
}

var METRICS = {
  commits:  { label:'Commits',  fetch: apiCommits },
  stars:    { label:'Stars',    fetch: function (r) { return apiRepo(r).then(function (d) { return (d && d.stargazers_count) || 0; }); } },
  forks:    { label:'Forks',    fetch: function (r) { return apiRepo(r).then(function (d) { return (d && d.forks_count) || 0; }); } },
  watchers: { label:'Watchers', fetch: function (r) { return apiRepo(r).then(function (d) { return (d && d.watchers_count) || 0; }); } }
};

var Res = {
  active: false, loading: false, metric: 'commits',
  scores: {}, norms: {},
  SMIN: 16, SMAX: 52,
  rMin: function () { return Math.min(W, H) * 0.10; },
  rMax: function () { return Math.min(W, H) * 0.40; },

  start: function (metric) {
    var self = this;
    if (self.loading) return;
    self.metric = metric;
    self.loading = true;
    self.active = false;
    resStatus.style.display = 'block';
    resStatus.textContent = 'fetching\u2026';
    resOK.disabled = true;

    var def = METRICS[self.metric];
    if (!def) { self.loading = false; return; }

    var pending = REPOS.length, results = [];
    function done(id, val) {
      results.push({ id: id, val: val || 0 });
      pending--;
      if (pending === 0) { self._finish(results); }
    }

    REPOS.forEach(function (r) {
      def.fetch(r)
        .then(function (v) { done(r.id, v); })
        ['catch'](function () { done(r.id, 0); });
    });
  },

  _finish: function (results) {
    var self = this;
    results.forEach(function (item) { self.scores[item.id] = item.val; });
    var vals = results.map(function (r) { return r.val; });
    var mn = Math.min.apply(null, vals);
    var mx = Math.max.apply(null, vals);
    var sp = mx - mn || 1;
    results.forEach(function (item) { self.norms[item.id] = (item.val - mn) / sp; });

    self.loading = false;
    self.active = true;
    resStatus.style.display = 'none';
    resOK.disabled = false;
    resBtn.classList.add('on');
    document.getElementById('res-lbl').textContent = 'resonating';
    closeMenu();
    self._apply();
  },

  stop: function () {
    this.active = false;
    this.loading = false;
    resBtn.classList.remove('on');
    document.getElementById('res-lbl').textContent = 'Resonate';
    resStatus.style.display = 'none';
    resOK.disabled = false;
    nodes.forEach(function (n) { n.targetR = 24; });
  },

  _apply: function () {
    if (!this.active || activeId >= 0) return;
    var self = this, cx = CX(), cy = CY();
    nodes.forEach(function (n) {
      var norm = (self.norms[n.repo.id] !== undefined) ? self.norms[n.repo.id] : 0.5;
      n.targetR = self.SMIN + norm * (self.SMAX - self.SMIN);
      var dist = self.rMax() - norm * (self.rMax() - self.rMin());
      n.tx = cx + Math.cos(n.orbitAngle) * dist;
      n.ty = cy + Math.sin(n.orbitAngle) * dist;
    });
  },

  tick: function () {
    if (!this.active || activeId >= 0) return;
    this._apply();
  },

  badges: function () {
    if (!this.active) return;
    var self = this, m = this.metric;
    nodes.forEach(function (n) {
      var raw = self.scores[n.repo.id];
      if (raw === undefined) return;
      var lbl = (raw >= 1000) ? (raw / 1000).toFixed(1) + 'k' : String(raw);
      ctx.font = '300 9px \'DM Mono\',monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(' + n.repo.rgb + ',0.6)';
      ctx.fillText(lbl, n.x, n.y + n.radius + 14);
    });
  }
};

/* ── Resonance menu UI ──────────────────────────── */
var selectedMetric = 'commits';

function openMenu() {
  menuOpen = true;
  resMenu.classList.add('open');
}
function closeMenu() {
  menuOpen = false;
  resMenu.classList.remove('open');
}

resBtn.addEventListener('click', function () {
  if (Res.loading) return;
  if (Res.active) {
    Res.stop();
    closeMenu();
    return;
  }
  if (menuOpen) { closeMenu(); } else { openMenu(); }
});

/* Radio options */
var opts = resMenu.querySelectorAll('.res-opt');
for (var oi = 0; oi < opts.length; oi++) {
  (function (opt) {
    opt.addEventListener('click', function () {
      for (var j = 0; j < opts.length; j++) { opts[j].classList.remove('sel'); }
      opt.classList.add('sel');
      selectedMetric = opt.getAttribute('data-m');
    });
  }(opts[oi]));
}

resOK.addEventListener('click', function () {
  if (Res.loading) return;
  Res.start(selectedMetric);
});

/* Close menu on outside click */
document.addEventListener('click', function (e) {
  if (!menuOpen) return;
  if (!resMenu.contains(e.target) && e.target !== resBtn && !resBtn.contains(e.target)) {
    closeMenu();
  }
});

/* ── Activate / Deactivate nodes ────────────────── */
function activate(id) {
  if (locked) return;
  locked = true; activeId = id;
  hintEl.style.opacity = '0';
  closeMenu();
  var cx = CX(), cy = CY(), push = OR() * 1.8;
  nodes.forEach(function (n) {
    if (n.repo.id === id) { n.tx = cx; n.ty = cy; n.targetR = 94; }
    else { n.tx = cx + Math.cos(n.orbitAngle) * push; n.ty = cy + Math.sin(n.orbitAngle) * push; n.targetR = 13; }
  });
  setTimeout(function () {
    for (var i = 0; i < REPOS.length; i++) {
      if (REPOS[i].id === id) { showCard(REPOS[i]); break; }
    }
    locked = false;
  }, 480);
}

function deactivate() {
  if (locked) return;
  locked = true;
  card.classList.remove('show');
  activeId = -1;
  if (!Res.active) { nodes.forEach(function (n) { n.targetR = 24; }); }
  hintEl.style.opacity = '1';
  setTimeout(function () { locked = false; }, 400);
}

function showCard(repo) {
  document.getElementById('c-eye').textContent = repo.eye;
  document.getElementById('c-eye').style.color = 'rgba(' + repo.rgb + ',0.65)';
  document.getElementById('c-name').textContent = repo.name;
  document.getElementById('c-desc').textContent = repo.desc;
  var h = '';
  for (var i = 0; i < repo.tags.length; i++) { h += '<span class="ctag">' + repo.tags[i] + '</span>'; }
  document.getElementById('c-tags').innerHTML = h;
  document.getElementById('btn-gh').href = repo.gh;
  document.getElementById('btn-io').href = repo.io;
  document.getElementById('card-line').style.background =
    'linear-gradient(90deg,transparent,rgba(' + repo.rgb + ',0.5),transparent)';
  card.style.borderColor = 'rgba(' + repo.rgb + ',0.32)';
  requestAnimationFrame(function () { card.classList.add('show'); });
}

closeBtn.addEventListener('click', deactivate);

/* ── Hit test ───────────────────────────────────── */
function hit(mx, my) {
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var dx = mx - n.x, dy = my - n.y;
    if (Math.sqrt(dx * dx + dy * dy) < n.radius + 16) return n;
  }
  return null;
}

canvas.addEventListener('click', function (e) {
  if (locked || activeId >= 0) return;
  var r = canvas.getBoundingClientRect();
  var n = hit(e.clientX - r.left, e.clientY - r.top);
  if (n) activate(n.repo.id);
});

canvas.addEventListener('mousemove', function (e) {
  if (activeId >= 0 || locked) { canvas.style.cursor = 'default'; return; }
  var r = canvas.getBoundingClientRect();
  canvas.style.cursor = hit(e.clientX - r.left, e.clientY - r.top) ? 'pointer' : 'default';
});

canvas.addEventListener('touchend', function (e) {
  if (locked || activeId >= 0) return;
  var touch = e.changedTouches[0];
  var r = canvas.getBoundingClientRect();
  var n = hit(touch.clientX - r.left, touch.clientY - r.top);
  if (n) { e.preventDefault(); activate(n.repo.id); }
}, { passive: false });

/* ── Draw loop ──────────────────────────────────── */
var EASE = 0.066;
function lerp(a, b, k) { return a + (b - a) * k; }

function draw() {
  requestAnimationFrame(draw);

  /* Skip rendering until canvas is properly sized */
  if (!sizeReady || W < 10 || H < 10) {
    /* Try to initialise if we haven't yet */
    var s = measure();
    if (s.w > 10 && s.h > 10) {
      W = s.w; H = s.h;
      canvas.width = W; canvas.height = H;
      sizeReady = true;
      spawnPts();
      resetOrbits(true);
    }
    return;
  }

  ctx.clearRect(0, 0, W, H);
  t += 0.012;
  var cx = CX(), cy = CY();
  var T = th(), bg = T.bg, pt = T.pt, bA = T.bA;

  /* Background */
  ctx.fillStyle = 'rgb(' + bg + ')';
  ctx.fillRect(0, 0, W, H);

  /* Ambient blobs */
  for (var bi = 0; bi < 3; bi++) {
    ctx.beginPath();
    ctx.arc(
      cx + Math.sin(t * 0.06 + bi * 2.1) * W * 0.28,
      cy + Math.cos(t * 0.045 + bi * 1.8) * H * 0.22,
      Math.min(W, H) * (0.32 + bi * 0.1), 0, Math.PI * 2
    );
    ctx.fillStyle = 'rgba(' + (bi === 1 ? '29,158,117' : pt) + ',' + (bA + bi * 0.004) + ')';
    ctx.fill();
  }

  /* Particles */
  for (var pi = 0; pi < pts.length; pi++) {
    var p = pts[pi];
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + pt + ',' + (p.a * (0.5 + 0.5 * Math.sin(t * 0.8 + p.ph))) + ')';
    ctx.fill();
  }

  /* Particle web */
  for (var wi = 0; wi < pts.length; wi += 2) {
    for (var wj = wi + 2; wj < pts.length; wj += 2) {
      var pa = pts[wi], pb = pts[wj];
      var wdx = pa.x - pb.x, wdy = pa.y - pb.y;
      var wd = Math.sqrt(wdx * wdx + wdy * wdy);
      if (wd < 115) {
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
        ctx.strokeStyle = 'rgba(' + pt + ',' + ((1 - wd / 115) * 0.028) + ')';
        ctx.lineWidth = 0.5; ctx.stroke();
      }
    }
  }

  /* Orbit / resonance tick */
  if (activeId < 0) {
    if (Res.active) {
      nodes.forEach(function (n) { n.orbitAngle += n.orbitSpeed * 0.4; });
      Res.tick();
    } else {
      var or = OR();
      nodes.forEach(function (n) {
        n.orbitAngle += n.orbitSpeed;
        n.tx = cx + Math.cos(n.orbitAngle) * or;
        n.ty = cy + Math.sin(n.orbitAngle) * or;
      });
    }
  }

  /* Lerp */
  nodes.forEach(function (n) {
    n.x      = lerp(n.x,      n.tx,      EASE);
    n.y      = lerp(n.y,      n.ty,      EASE);
    n.radius = lerp(n.radius, n.targetR, EASE);
  });

  /* Node–node edges */
  var md = Math.min(W, H);
  for (var ei = 0; ei < nodes.length; ei++) {
    for (var ej = ei + 1; ej < nodes.length; ej++) {
      var na = nodes[ei], nb = nodes[ej];
      var ex = na.x - nb.x, ey = na.y - nb.y;
      var ed = Math.sqrt(ex * ex + ey * ey);
      if (ed < md) {
        ctx.beginPath(); ctx.moveTo(na.x, na.y); ctx.lineTo(nb.x, nb.y);
        ctx.strokeStyle = 'rgba(' + pt + ',' + ((1 - ed / md) * 0.13 * (0.6 + 0.4 * Math.sin(t + ei))) + ')';
        ctx.lineWidth = 0.5; ctx.stroke();
      }
    }
  }

  /* Active pulse line + dot */
  nodes.forEach(function (n) {
    if (n.repo.id !== activeId) return;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(n.x, n.y);
    ctx.strokeStyle = 'rgba(' + n.repo.rgb + ',0.07)';
    ctx.lineWidth = 0.5; ctx.stroke();
    var pr = (t * 0.5) % 1;
    ctx.beginPath();
    ctx.arc(cx + (n.x - cx) * pr, cy + (n.y - cy) * pr, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + n.repo.rgb + ',0.7)'; ctx.fill();
  });

  /* Nodes */
  nodes.forEach(function (n) {
    var r = n.repo, ia = (r.id === activeId);
    var pv = 0.65 + 0.35 * Math.sin(t * 1.1 + n.pulse);

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius + 7 + 5 * Math.sin(t * 1.3 + n.pulse), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(' + r.rgb + ',' + (ia ? 0.2 * pv : 0.06 * pv) + ')';
    ctx.lineWidth = ia ? 1.5 : 0.5; ctx.stroke();

    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius + 2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(' + r.rgb + ',' + (ia ? 0.35 : 0.11 * pv) + ')';
    ctx.lineWidth = 0.5; ctx.stroke();

    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(' + r.rgb + ',' + (ia ? 0.14 : 0.06) + ')'; ctx.fill();
    ctx.strokeStyle = 'rgba(' + r.rgb + ',' + (ia ? 0.8 : 0.3 * pv) + ')';
    ctx.lineWidth = ia ? 1 : 0.5; ctx.stroke();

    ctx.font = '400 ' + (ia ? 13 : 11) + 'px \'DM Mono\',monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(' + r.rgb + ',' + (ia ? 0.9 : 0.55) + ')';
    if (ia) {
      var ws = r.name.split(' ');
      if (ws.length <= 2) { ctx.fillText(r.name, n.x, n.y); }
      else { ctx.fillText(ws.slice(0,2).join(' '), n.x, n.y - 9); ctx.fillText(ws.slice(2).join(' '), n.x, n.y + 9); }
    } else {
      var ps = r.name.split(' ');
      ctx.fillText(ps.length > 2 ? ps.slice(-2).join(' ') : ps[ps.length - 1], n.x, n.y);
    }
  });

  /* Origin pulse */
  ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(' + pt + ',' + (0.14 + 0.1 * Math.sin(t)) + ')'; ctx.fill();

  /* Resonance badges */
  Res.badges();
}

draw();

}());
</script>
