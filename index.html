<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nztdev · field of works</title>
<meta name="description" content="nztdev — experimental systems at the edge of computation, biology, and signal.">
<meta property="og:title" content="nztdev · field of works">
<meta property="og:description" content="Experimental systems at the edge of computation, biology, and signal.">
<meta property="og:url" content="https://nztdev.github.io">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap');

  :root {
    --col-bg: #0a090f;
    --col-surface: rgba(18,16,28,0.96);
    --col-border: rgba(127,119,221,0.18);
    --col-border-hover: rgba(127,119,221,0.45);
    --col-text: #e8e6f8;
    --col-muted: rgba(232,230,248,0.45);
    --col-hint: rgba(127,119,221,0.38);
    --col-purple: rgba(127,119,221,;
    --col-teal: rgba(29,158,117,;
    --col-amber: rgba(239,159,39,;
    --font-display: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--col-bg);
    overflow: hidden;
    font-family: var(--font-body);
    color: var(--col-text);
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }

  #canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* Header */
  #header {
    position: absolute;
    top: 28px;
    left: 36px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #header h1 {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.22em;
    color: var(--col-hint);
    text-transform: uppercase;
  }
  #header p {
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 300;
    font-style: italic;
    color: rgba(127,119,221,0.22);
    letter-spacing: 0.06em;
  }

  /* Live indicator */
  #live {
    position: absolute;
    top: 32px;
    right: 36px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 300;
    color: rgba(29,158,117,0.5);
    letter-spacing: 0.1em;
  }
  #live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #1D9E75;
    animation: livepulse 2.4s ease-in-out infinite;
  }
  @keyframes livepulse {
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:0.35;transform:scale(0.7)}
  }

  /* Hint */
  #hint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: var(--col-hint);
    text-transform: uppercase;
    transition: opacity 0.6s;
    white-space: nowrap;
  }

  /* Node count */
  #nodecount {
    position: absolute;
    bottom: 30px;
    right: 36px;
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 300;
    color: rgba(127,119,221,0.2);
    letter-spacing: 0.1em;
  }

  /* Card panel */
  #panel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #card {
    pointer-events: all;
    width: 360px;
    background: var(--col-surface);
    border: 0.5px solid var(--col-border);
    border-radius: 18px;
    padding: 28px 28px 24px;
    opacity: 0;
    transform: scale(0.84) translateY(10px);
    transition: opacity 0.38s cubic-bezier(0.22,1,0.36,1), transform 0.38s cubic-bezier(0.22,1,0.36,1);
    position: relative;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  #card.show {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  #card-accent {
    position: absolute;
    top: 0; left: 28px; right: 28px;
    height: 1px;
    border-radius: 99px;
    transition: background 0.3s;
  }

  #closeBtn {
    position: absolute;
    top: 14px; right: 16px;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 0.5px solid rgba(127,119,221,0.2);
    background: transparent;
    cursor: pointer;
    color: var(--col-muted);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    font-family: var(--font-body);
  }
  #closeBtn:hover {
    background: rgba(127,119,221,0.1);
    border-color: rgba(127,119,221,0.4);
    color: var(--col-text);
  }

  #c-eye {
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
    transition: color 0.3s;
  }
  #c-title {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: -0.4px;
    color: var(--col-text);
    margin-bottom: 10px;
    line-height: 1.15;
  }
  #c-desc {
    font-size: 13px;
    font-weight: 300;
    color: var(--col-muted);
    line-height: 1.65;
    margin-bottom: 18px;
  }
  #c-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 22px;
  }
  .c-tag {
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 300;
    padding: 3px 9px;
    border-radius: 99px;
    border: 0.5px solid rgba(127,119,221,0.22);
    color: rgba(127,119,221,0.55);
    letter-spacing: 0.05em;
  }

  .c-divider {
    height: 0.5px;
    background: rgba(127,119,221,0.12);
    margin-bottom: 20px;
  }

  #c-actions {
    display: flex;
    gap: 10px;
  }
  .c-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 11px 8px;
    border-radius: 10px;
    border: 0.5px solid rgba(127,119,221,0.25);
    color: var(--col-muted);
    background: transparent;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }
  .c-btn:hover {
    background: rgba(127,119,221,0.09);
    border-color: rgba(127,119,221,0.5);
    color: var(--col-text);
  }
  .c-btn.primary {
    background: rgba(127,119,221,0.1);
    border-color: rgba(127,119,221,0.4);
    color: var(--col-text);
  }
  .c-btn.primary:hover {
    background: rgba(127,119,221,0.18);
    border-color: rgba(127,119,221,0.65);
  }
  .c-btn svg {
    width: 13px; height: 13px;
    flex-shrink: 0;
    opacity: 0.7;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="header">
    <h1>nztdev</h1>
    <p>field of works</p>
  </div>

  <div id="live">
    <div id="live-dot"></div>
    <span>github.com/nztdev</span>
  </div>

  <div id="hint">select a node</div>
  <div id="nodecount"></div>

  <div id="panel">
    <div id="card">
      <div id="card-accent"></div>
      <button id="closeBtn" aria-label="close panel">×</button>
      <div id="c-eye"></div>
      <div id="c-title"></div>
      <div id="c-desc"></div>
      <div id="c-tags"></div>
      <div class="c-divider"></div>
      <div id="c-actions">
        <a class="c-btn primary" id="btn-gh" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
          </svg>
          GitHub repo
        </a>
        <a class="c-btn" id="btn-io" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          live page
        </a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {

  const REPOS = [
    {
      id: 0,
      name: 'B.O.S.S. Kernel',
      eye: 'biological kernel · JS / Python / HTML',
      desc: 'A resonant routing kernel treating AI intent as a biological pulse. Nodes warm to fire and decay before re-activation. The Soma gates the Cortex through thermal readiness and semantic alignment to prevent ungrounded actions.',
      tags: ['resonance physics', 'metabolic decay', 'sovereign AI', 'PWA', 'arbiter'],
      gh: 'https://github.com/nztdev/boss-kernel',
      io: 'https://nztdev.github.io/boss-kernel/core/',
      rgb: '127,119,221',
    },
    {
      id: 1,
      name: 'Resonance Signal',
      eye: 'electronic music intelligence · HTML',
      desc: 'Electronic music intelligence, alive and curated. A living feed that moves at the frequency of now — where the signal finds you before you find it.',
      tags: ['music intelligence', 'electronic', 'live feed', '2026'],
      gh: 'https://github.com/nztdev/resonance-signal',
      io: 'https://nztdev.github.io/resonance-signal/',
      rgb: '29,158,117',
    },
    {
      id: 2,
      name: 'B.O.S.S. Deliberate',
      eye: 'intentional interface · HTML',
      desc: 'The deliberate layer of the B.O.S.S. architecture. Intention is set before action is permitted. Slow thought made visible — the counterweight to impulse in the resonant system.',
      tags: ['intentional UI', 'somatic design', 'B.O.S.S.', 'paced action'],
      gh: 'https://github.com/nztdev/boss-deliberate',
      io: 'https://nztdev.github.io/boss-deliberate/',
      rgb: '239,159,39',
    },
  ];

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const card = document.getElementById('card');
  const hint = document.getElementById('hint');
  const closeBtn = document.getElementById('closeBtn');
  const nodecount = document.getElementById('nodecount');

  let W, H, t = 0, activeId = -1, locked = false;

  /* ── Nodes ─────────────────────────────────────────────── */
  const nodes = REPOS.map((r, i) => ({
    repo: r,
    x: 0, y: 0, tx: 0, ty: 0,
    r: 24, tr: 24,
    orbitAngle: (i / REPOS.length) * Math.PI * 2 - Math.PI / 2,
    orbitSpeed: (0.00022 + Math.random() * 0.00013) * (i % 2 === 0 ? 1 : -1),
    pulse: Math.random() * Math.PI * 2,
    labelAlpha: 1,
  }));

  /* ── Particles ──────────────────────────────────────────── */
  const PARTICLE_COUNT = 70;
  const particles = [];

  function spawnParticles() {
    particles.length = 0;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        r: Math.random() * 1.4 + 0.2,
        alpha: Math.random() * 0.2 + 0.03,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  /* ── Resize ─────────────────────────────────────────────── */
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    spawnParticles();
    if (activeId < 0) resetOrbits(true);
  }
  resize();
  window.addEventListener('resize', resize);

  function cx() { return W / 2; }
  function cy() { return H / 2; }
  function orbitRadius() { return Math.min(W, H) * 0.26; }

  function resetOrbits(snap) {
    nodes.forEach(n => {
      n.tx = cx() + Math.cos(n.orbitAngle) * orbitRadius();
      n.ty = cy() + Math.sin(n.orbitAngle) * orbitRadius();
      n.tr = 24;
      if (snap) { n.x = n.tx; n.y = n.ty; }
    });
  }

  resetOrbits(true);
  nodecount.textContent = REPOS.length + ' works';

  /* ── Activate / Deactivate ──────────────────────────────── */
  function activateNode(id) {
    if (locked) return;
    locked = true;
    activeId = id;
    hint.style.opacity = '0';

    nodes.forEach(n => {
      if (n.repo.id === id) {
        n.tx = cx(); n.ty = cy(); n.tr = 96;
      } else {
        const push = orbitRadius() * 1.8;
        n.tx = cx() + Math.cos(n.orbitAngle) * push;
        n.ty = cy() + Math.sin(n.orbitAngle) * push;
        n.tr = 14;
      }
    });

    setTimeout(() => {
      showCard(REPOS.find(r => r.id === id));
      locked = false;
    }, 500);
  }

  function deactivate() {
    if (locked) return;
    locked = true;
    card.classList.remove('show');
    activeId = -1;
    nodes.forEach(n => { n.tr = 24; });
    hint.style.opacity = '1';
    setTimeout(() => { locked = false; }, 420);
  }

  function showCard(repo) {
    document.getElementById('c-eye').textContent = repo.eye;
    document.getElementById('c-eye').style.color = `rgba(${repo.rgb},0.6)`;
    document.getElementById('c-title').textContent = repo.name;
    document.getElementById('c-desc').textContent = repo.desc;
    document.getElementById('c-tags').innerHTML = repo.tags
      .map(t => `<span class="c-tag">${t}</span>`).join('');
    document.getElementById('btn-gh').href = repo.gh;
    document.getElementById('btn-io').href = repo.io;
    document.getElementById('card-accent').style.background =
      `linear-gradient(90deg, transparent, rgba(${repo.rgb},0.5), transparent)`;
    card.style.borderColor = `rgba(${repo.rgb},0.35)`;
    requestAnimationFrame(() => card.classList.add('show'));
  }

  /* ── Events ─────────────────────────────────────────────── */
  closeBtn.addEventListener('click', deactivate);

  canvas.addEventListener('click', e => {
    if (locked || activeId >= 0) return;
    const mx = e.clientX, my = e.clientY;
    for (const n of nodes) {
      const dx = mx - n.x, dy = my - n.y;
      if (Math.sqrt(dx * dx + dy * dy) < n.r + 16) {
        activateNode(n.repo.id);
        return;
      }
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (activeId >= 0 || locked) { canvas.style.cursor = 'default'; return; }
    const mx = e.clientX, my = e.clientY;
    let hit = false;
    for (const n of nodes) {
      const dx = mx - n.x, dy = my - n.y;
      if (Math.sqrt(dx * dx + dy * dy) < n.r + 16) { hit = true; break; }
    }
    canvas.style.cursor = hit ? 'pointer' : 'default';
  });

  /* ── Draw loop ──────────────────────────────────────────── */
  const EASE = 0.065;
  function lerp(a, b, k) { return a + (b - a) * k; }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.012;
    const CX = cx(), CY = cy();

    /* background grain (cheap noise via layered circles) */
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(
        CX + Math.sin(t * 0.07 + i * 2.1) * W * 0.3,
        CY + Math.cos(t * 0.05 + i * 1.7) * H * 0.25,
        Math.min(W, H) * (0.35 + i * 0.12),
        0, Math.PI * 2
      );
      ctx.fillStyle = `rgba(${i === 1 ? '29,158,117' : '127,119,221'},${0.012 + i * 0.004})`;
      ctx.fill();
    }

    /* particles */
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      const a = p.alpha * (0.5 + 0.5 * Math.sin(t * 0.8 + p.phase));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(127,119,221,${a})`;
      ctx.fill();
    });

    /* particle web */
    for (let i = 0; i < particles.length; i += 2) {
      for (let j = i + 2; j < particles.length; j += 2) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(127,119,221,${(1 - d / 120) * 0.03})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    /* orbit nodes when idle */
    if (activeId < 0) {
      nodes.forEach(n => {
        n.orbitAngle += n.orbitSpeed;
        n.tx = CX + Math.cos(n.orbitAngle) * orbitRadius();
        n.ty = CY + Math.sin(n.orbitAngle) * orbitRadius();
      });
    }

    /* lerp positions */
    nodes.forEach(n => {
      n.x = lerp(n.x, n.tx, EASE);
      n.y = lerp(n.y, n.ty, EASE);
      n.r = lerp(n.r, n.tr, EASE);
    });

    /* edges between nodes */
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        const maxD = Math.min(W, H);
        if (d < maxD) {
          const al = (1 - d / maxD) * 0.14 * (0.6 + 0.4 * Math.sin(t + i));
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(127,119,221,${al})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    /* edges from centre to active node */
    nodes.forEach((n, i) => {
      if (n.repo.id !== activeId) return;
      const prog = ((t * 0.5) % 1);
      const dotX = CX + (n.x - CX) * prog;
      const dotY = CY + (n.y - CY) * prog;
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(n.x, n.y);
      ctx.strokeStyle = `rgba(${n.repo.rgb},0.08)`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(dotX, dotY, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${n.repo.rgb},0.7)`;
      ctx.fill();
    });

    /* draw nodes */
    nodes.forEach(n => {
      const r = n.repo;
      const isActive = r.id === activeId;
      const pulse = 0.65 + 0.35 * Math.sin(t * 1.1 + n.pulse);

      /* outer pulse ring */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 7 + 5 * Math.sin(t * 1.3 + n.pulse), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${r.rgb},${isActive ? 0.2 * pulse : 0.06 * pulse})`;
      ctx.lineWidth = isActive ? 1.5 : 0.5;
      ctx.stroke();

      /* second ring */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${r.rgb},${isActive ? 0.35 : 0.12 * pulse})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();

      /* core */
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r.rgb},${isActive ? 0.14 : 0.06})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${r.rgb},${isActive ? 0.8 : 0.32 * pulse})`;
      ctx.lineWidth = isActive ? 1 : 0.5;
      ctx.stroke();

      /* label */
      const fs = isActive ? 13 : 11;
      ctx.font = `400 ${fs}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(${r.rgb},${isActive ? 0.9 : 0.55})`;

      if (isActive) {
        const words = r.name.split(' ');
        if (words.length <= 2) {
          ctx.fillText(r.name, n.x, n.y);
        } else {
          ctx.fillText(words.slice(0, 2).join(' '), n.x, n.y - 8);
          ctx.fillText(words.slice(2).join(' '), n.x, n.y + 8);
        }
      } else {
        ctx.fillText(r.name.split(' ').pop(), n.x, n.y);
      }
    });

    /* centre origin */
    ctx.beginPath();
    ctx.arc(CX, CY, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(127,119,221,${0.15 + 0.1 * Math.sin(t)})`;
    ctx.fill();

    requestAnimationFrame(draw);
  }

  draw();

})();
</script>
</body>
</html>
